services:
  postgres:
    image: postgres:18-alpine
    container_name: elysia-postgres-local
    environment:
      POSTGRES_USER: elysia
      POSTGRES_PASSWORD: elysia_local_pass
      POSTGRES_DB: elysia_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elysia -d elysia_dev"]
      interval: 5s
      timeout: 3s
      retries: 3

  redis:
    image: redis:8-alpine
    container_name: elysia-redis-local
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_local_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  minio:
    image: docker.io/pgsty/minio:latest
    container_name: elysia-minio-local
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_local_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio-init:
    image: docker.io/pgsty/minio:latest
    container_name: elysia-minio-init-local
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/dockchain;
      mc anonymous set download local/dockchain;
      exit 0;
      "

  migrate:
    image: oven/bun:1
    container_name: elysia-migrate-local
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql://elysia:elysia_local_pass@postgres:5432/elysia_dev
    depends_on:
      postgres:
        condition: service_healthy
    command: bun run db:migrate
    restart: "no"

volumes:
  postgres_local_data:
  redis_local_data:
  minio_local_data:
